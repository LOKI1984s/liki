<script src="assets/js/common.js"></script>
<script>
const memberTypeLabel = { distributor:'총판회원', agency:'대리점회원' };
const memberTypeClass = { distributor:'badge-owner', agency:'badge-grade-general' };
const myMembers = [
  { name:'서지훈', phone:'010-2345-6789', joined:'2026-05-12', route:'자체 가입', type:'distributor', orders:5, amount:842000 },
  { name:'한소율', phone:'010-3456-7890', joined:'2026-06-01', route:'카카오', type:'agency', orders:2, amount:340000 },
  { name:'유하준', phone:'010-4567-8901', joined:'2026-06-20', route:'네이버', type:'agency', orders:3, amount:520000 },
  { name:'배지안', phone:'010-5678-9012', joined:'2026-07-14', route:'자체 가입', type:'distributor', orders:1, amount:140000 },
];
function render(){
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = myMembers.filter(m => !kw || m.name.toLowerCase().includes(kw) || m.phone.includes(kw));
  document.getElementById('memberTbody').innerHTML = filtered.map(m => `
    <tr>
      <td style="font-weight:600;">${m.name}</td>
      <td style="color:var(--text-sub);font-size:12.5px;">${m.phone}</td>
      <td style="color:var(--text-sub);font-size:12.5px;">${m.joined}</td>
      <td style="color:var(--text-sub);font-size:12.5px;">${m.route}</td>
      <td><span class="badge ${memberTypeClass[m.type]}">${memberTypeLabel[m.type]}</span></td>
      <td>${m.orders}건</td>
      <td>${m.amount.toLocaleString()}원</td>
    </tr>
  `).join('');
}
function exportMembersExcel(){
  const rows = [['이름','연락처','가입일','가입경로','구분','주문건수','누적 구매금액']];
  myMembers.forEach(m => rows.push([m.name, m.phone, m.joined, m.route, memberTypeLabel[m.type], m.orders, m.amount]));
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '내회원목록_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('엑셀 파일을 다운로드했습니다');
}
render();
</script>
