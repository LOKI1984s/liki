<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>페이지 없음 | RAY</title>
  <meta name="theme-color" content="#08090a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%2308090a%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2222%22 text-anchor=%22middle%22 fill=%22%23c6f432%22 font-family=%22sans-serif%22 font-weight=%22700%22%3ER%3C/text%3E%3C/svg%3E" />
  <!-- 404는 어느 경로에서든 뜨므로 스타일은 인라인으로 둔다 -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100svh; display: grid; place-items: center; padding: 24px;
      background: #08090a; color: #f4f4f5;
      font-family: "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 480px; text-align: center; }
    .mark { font-family: ui-monospace, "Geist Mono", monospace; color: #c6f432; font-size: 13px; letter-spacing: .08em; }
    h1 { font-size: 34px; letter-spacing: -0.04em; margin: 14px 0 12px; }
    p { color: #b6b8bd; line-height: 1.7; font-size: 15px; }
    .hint { margin-top: 8px; font-size: 13px; color: #6e7178; }
    .btns { display: flex; gap: 10px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }
    a { display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 999px; text-decoration: none; font-size: 14px; font-weight: 600; }
    .primary { background: #c6f432; color: #0b0d00; }
    .ghost { color: #f4f4f5; border: 1px solid rgba(255,255,255,.16); }
  </style>
</head>
<body>
  <main>
    <p class="mark">RAY · 404</p>
    <h1 id="t">페이지를 찾을 수 없습니다</h1>
    <p id="d">주소가 바뀌었거나 없는 페이지입니다.</p>
    <p class="hint" id="h"></p>
    <div class="btns">
      <a class="primary" id="home" href="./">홈으로</a>
      <a class="ghost" id="back" href="#" onclick="history.back(); return false;">이전 화면</a>
    </div>
  </main>
  <script>
    // GitHub Pages 프로젝트 사이트는 /저장소명/ 아래에 있으므로 홈 경로를 계산한다
    const seg = location.pathname.split("/").filter(Boolean);
    const base = location.hostname.endsWith("github.io") && seg.length ? `/${seg[0]}/` : "/";
    document.getElementById("home").href = base;
    if (location.pathname.includes("/showcase/")) {
      document.getElementById("t").textContent = "공개본에서 제외된 화면입니다";
      document.getElementById("d").textContent = "로그인 · 회원가입 · 결제 · 관리자 계정 화면은 포트폴리오 공개본에 포함하지 않았습니다.";
      document.getElementById("h").textContent = "프로토타입의 다른 화면은 사업 모델 페이지에서 볼 수 있습니다.";
    }
    // 프로토타입 미리보기(iframe) 안에서는 이동 버튼 대신 이전 화면만
    if (window.top !== window) document.getElementById("home").remove();
  </script>
</body>
</html>
