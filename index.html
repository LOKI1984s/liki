<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio</title>
  <meta name="description" content="포트폴리오 — 기술, 연혁, 개발, 프로젝트, 레퍼런스" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <nav class="wrap nav">
      <a href="#top" class="brand" id="brand"></a>
      <ul class="menu">
        <li><a href="#skills">기술</a></li>
        <li><a href="#history">연혁</a></li>
        <li><a href="#dev">개발</a></li>
        <li><a href="#projects">프로젝트</a></li>
        <li><a href="#references">레퍼런스</a></li>
      </ul>
      <button class="print-btn" onclick="window.print()" aria-label="PDF 저장">PDF</button>
    </nav>
  </header>

  <main id="top" class="wrap">
    <section class="hero" id="hero"></section>

    <section class="block" id="skills">
      <h2 class="block-title"><span>01</span>기술</h2>
      <div class="skills" id="skills-list"></div>
    </section>

    <section class="block" id="history">
      <h2 class="block-title"><span>02</span>연혁</h2>
      <ol class="timeline" id="history-list"></ol>
    </section>

    <section class="block" id="dev">
      <h2 class="block-title"><span>03</span>개발</h2>
      <div class="dev" id="dev-list"></div>
    </section>

    <section class="block" id="projects">
      <h2 class="block-title"><span>04</span>프로젝트</h2>
      <div class="projects" id="project-list"></div>
    </section>

    <section class="block" id="references">
      <h2 class="block-title"><span>05</span>레퍼런스</h2>
      <ul class="refs" id="ref-list"></ul>
    </section>
  </main>

  <footer class="wrap footer" id="footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
